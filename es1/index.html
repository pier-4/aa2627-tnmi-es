<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E1. Ricombinare una fotografia</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <main id="contenitore">
      <div id="messaggio-focus" hidden>
        <p class="titolo">Finestra non attiva</p>
        <p>Clicca sulla tela per riattivare i comandi da tastiera</p>
      </div>
    </main>

    <div id="comandi">
      <button
        id="pulsante-aiuto"
        type="button"
        aria-expanded="true"
        aria-controls="aiuto"
      >
        <kbd class="evidenziato">H</kbd>
        <span id="testo-pulsante">Chiudi aiuto</span>
      </button>

      <aside id="aiuto" aria-label="Comandi">
        <p>
          <kbd class="evidenziato">H</kbd> apre e chiude l'aiuto ·
          <kbd>S</kbd> salva l'immagine
        </p>
        <p>Tasto sinistro del mouse: blocca / sblocca la composizione</p>
        <p>
          Posizione X del mouse: forza della rotazione · posizione Y: numero di
          anelli
        </p>
      </aside>
    </div>
  </body>
</html>
